services:
  - type: web
    name: alphabet-rush-server
    runtime: node
    plan: free
    region: virginia
    rootDir: server
    repo: https://github.com/ayushydv1805/Alphabet-Rush
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: AUTH_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: alphabet-rush-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: alphabet-rush-redis
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false

  - type: keyvalue
    name: alphabet-rush-redis
    plan: free
    region: virginia
    maxmemoryPolicy: allkeys_lru

databases:
  - name: alphabet-rush-db
    plan: free
    region: virginia
